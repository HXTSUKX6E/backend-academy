# Тестовая конфигурация scrapper
# Переопределяет только те настройки, которые мешают интеграционным тестам
app:
  rate-limiter:
    # Высокий лимит, чтобы интеграционные тесты не получали 429.
    # RateLimitingTest переопределяет Registry через @Primary @TestConfiguration
    # и работает независимо от этого значения.
    limit-for-period: 100000
