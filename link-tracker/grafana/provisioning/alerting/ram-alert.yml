apiVersion: 1

groups:
  - orgId: 1
    name: linktracker-memory-alerts
    folder: LinkTracker
    interval: 1m
    rules:
      - uid: linktracker-ram-alert
        title: High JVM Heap Memory Usage
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: sum(jvm_memory_used_bytes{area="heap"}) by (job)
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params:
                      - 536870912
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              datasource:
                name: Expression
                type: __expr__
                uid: "__expr__"
              expression: A
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          description: "JVM heap memory for {{ $labels.job }} is above 512MB (current: {{ $values.A | humanize1024 }}B)"
          runbook_url: ""
          summary: "High heap memory usage in {{ $labels.job }}"
        labels:
          severity: warning
